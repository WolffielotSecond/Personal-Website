name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/configure-pages@v5
      - name: Package site with verified media and Unity builds
        run: |
          git lfs fsck --pointers --objects
          unity_dir=assets/games/the-retrieval
          for required in index.html Build/builds.loader.js Build/builds.framework.js.unityweb Build/builds.data.unityweb Build/builds.wasm.unityweb; do
            if [[ ! -s "$unity_dir/$required" ]]; then
              echo "Missing Unity build file: $unity_dir/$required" >&2
              exit 1
            fi
          done
          unity_dir=assets/games/the-house-of-janus
          for required in index.html Build/Builds.loader.js Build/Builds.framework.js Build/Builds.data Build/Builds.wasm; do
            if [[ ! -s "$unity_dir/$required" ]]; then
              echo "Missing Unity build file: $unity_dir/$required" >&2
              exit 1
            fi
          done
          shopt -s globstar nullglob
          for asset in assets/videos/*.mp4 assets/games/**/*.unityweb assets/games/**/*.data assets/games/**/*.wasm; do
            if git lfs pointer --check --file="$asset"; then
              echo "Asset is still an LFS pointer: $asset" >&2
              exit 1
            fi
          done
          mkdir _site
          cp -R index.html CNAME assets _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
